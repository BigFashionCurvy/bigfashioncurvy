<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reloj Digital - Múltiples Zonas Horarias</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  max-width: 1000px;
  width: 100%;
}

.header {
  text-align: center;
  color: white;
  margin-bottom: 40px;
}

.header h1 {
  font-size: 2.5em;
  margin-bottom: 10px;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

.clocks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.clock {
  background: white;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  text-align: center;
  transition: transform 0.3s ease;
}

.clock:hover {
  transform: translateY(-5px);
}

.timezone-name {
  font-size: 1.2em;
  font-weight: bold;
  color: #667eea;
  margin-bottom: 15px;
  text-transform: uppercase;
}

.time-display {
  font-size: 2.5em;
  font-weight: bold;
  color: #333;
  font-family: 'Courier New', monospace;
  margin-bottom: 10px;
  letter-spacing: 2px;
}

.date-display {
  font-size: 0.9em;
  color: #666;
  margin-bottom: 15px;
}

.ampm {
  font-size: 1.1em;
  color: #764ba2;
  font-weight: bold;
}

.add-timezone {
  background: white;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  margin-bottom: 20px;
}

.timezone-form {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

.timezone-form select,
.timezone-form button {
  padding: 12px 20px;
  border: 2px solid #667eea;
  border-radius: 10px;
  font-size: 1em;
  cursor: pointer;
  transition: all 0.3s ease;
}

.timezone-form select {
  background: white;
  color: #333;
  flex: 1;
  min-width: 200px;
}

.timezone-form button {
  background: #667eea;
  color: white;
  font-weight: bold;
  transition: all 0.3s ease;
}

.timezone-form button:hover {
  background: #764ba2;
  transform: scale(1.05);
}

.remove-btn {
  margin-top: 10px;
  padding: 8px 15px;
  background: #ff6b6b;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9em;
  transition: all 0.3s ease;
}

.remove-btn:hover {
  background: #ff5252;
}

.info {
  background: rgba(255,255,255,0.1);
  color: white;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  font-size: 0.95em;
}

@media (max-width: 768px) {
  .header h1 {
    font-size: 1.8em;
  }

  .time-display {
    font-size: 2em;
  }

  .clocks-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🕐 Reloj Mundial</h1>
    <p>Múltiples Zonas Horarias en Tiempo Real</p>
  </div>

  <div class="add-timezone">
    <div class="timezone-form">
      <select id="timezoneSelect">
        <option value="">Selecciona una zona horaria...</option>
        <option value="America/Mexico_City">México (CDMX)</option>
        <option value="America/New_York">Nueva York (EST)</option>
        <option value="America/Los_Angeles">Los Ángeles (PST)</option>
        <option value="Europe/London">Londres (GMT)</option>
        <option value="Europe/Paris">París (CET)</option>
        <option value="Asia/Tokyo">Tokio (JST)</option>
        <option value="Asia/Shanghai">Shanghái (CST)</option>
        <option value="Asia/Dubai">Dubái (GST)</option>
        <option value="Australia/Sydney">Sídney (AEDT)</option>
        <option value="Pacific/Auckland">Auckland (NZDT)</option>
        <option value="America/São_Paulo">São Paulo (BRT)</option>
        <option value="Africa/Cairo">El Cairo (EET)</option>
        <option value="Asia/Bangkok">Bangkok (ICT)</option>
        <option value="Asia/Singapore">Singapur (SGT)</option>
        <option value="Europe/Moscow">Moscú (MSK)</option>
      </select>
      <button onclick="addTimezone()">+ Agregar Zona Horaria</button>
    </div>
  </div>

  <div class="clocks-grid" id="clocksContainer">
    <!-- Los relojes se generarán dinámicamente aquí -->
  </div>

  <div class="info">
    <p>💡 Los relojes se actualizan cada segundo. Agrega más zonas horarias usando el selector arriba.</p>
  </div>
</div>

<script>
// Zonas horarias predeterminadas
let timezones = [
  'America/Mexico_City',
  'America/New_York',
  'Europe/London',
  'Asia/Tokyo'
];

// Nombres amigables para las zonas horarias
const timezoneNames = {
  'America/Mexico_City': 'México (CDMX)',
  'America/New_York': 'Nueva York',
  'America/Los_Angeles': 'Los Ángeles',
  'Europe/London': 'Londres',
  'Europe/Paris': 'París',
  'Asia/Tokyo': 'Tokio',
  'Asia/Shanghai': 'Shanghái',
  'Asia/Dubai': 'Dubái',
  'Australia/Sydney': 'Sídney',
  'Pacific/Auckland': 'Auckland',
  'America/São_Paulo': 'São Paulo',
  'Africa/Cairo': 'El Cairo',
  'Asia/Bangkok': 'Bangkok',
  'Asia/Singapore': 'Singapur',
  'Europe/Moscow': 'Moscú'
};

function formatTime(date) {
  return date.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}

function formatDate(date) {
  return date.toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function updateClocks() {
  const container = document.getElementById('clocksContainer');
  container.innerHTML = '';

  timezones.forEach((tz, index) => {
    const date = new Date(new Date().toLocaleString('en-US', { timeZone: tz }));
    const time = formatTime(date);
    const dateStr = formatDate(date);
    const ampm = date.getHours() >= 12 ? 'PM' : 'AM';

    const clockHTML = `
      <div class="clock">
        <div class="timezone-name">${timezoneNames[tz] || tz}</div>
        <div class="time-display">${time}</div>
        <div class="ampm">${ampm}</div>
        <div class="date-display">${dateStr}</div>
        <button class="remove-btn" onclick="removeTimezone('${tz}')">Eliminar</button>
      </div>
    `;
    container.innerHTML += clockHTML;
  });
}

function addTimezone() {
  const select = document.getElementById('timezoneSelect');
  const tz = select.value;

  if (!tz) {
    alert('Por favor selecciona una zona horaria');
    return;
  }

  if (timezones.includes(tz)) {
    alert('Esta zona horaria ya está agregada');
    return;
  }

  timezones.push(tz);
  select.value = '';
  updateClocks();
}

function removeTimezone(tz) {
  timezones = timezones.filter(t => t !== tz);
  updateClocks();
}

// Actualizar relojes cada segundo
setInterval(updateClocks, 1000);

// Inicializar
updateClocks();

// Permitir agregar zona con Enter
document.getElementById('timezoneSelect').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') addTimezone();
});
</script>

</body>
</html>
